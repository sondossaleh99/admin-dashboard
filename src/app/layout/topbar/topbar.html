<header class="topbar d-flex align-items-center gap-3">
  <div class="d-lg-none">
    <button
      pButton
      type="button"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      [attr.aria-label]="'topbar.openNavigation' | translate"
      (click)="openDrawer()"
    >
      <i pButtonIcon class="pi pi-bars"></i>
    </button>
  </div>

  <div class="d-flex align-items-center gap-1 ms-auto">
    @for (action of actions; track action.icon) {
      <p-overlaybadge [value]="action.badge" severity="danger" [badgeDisabled]="!action.badge">
        <button
          pButton
          type="button"
          [text]="true"
          [rounded]="true"
          severity="secondary"
          [attr.aria-label]="
            action.badge
              ? ('topbar.unread'
                | translate: { label: (action.label | translate), count: action.badge })
              : (action.label | translate)
          "
        >
          <i pButtonIcon [class]="action.icon"></i>
        </button>
      </p-overlaybadge>
    }

    <button
      pButton
      type="button"
      [text]="true"
      severity="secondary"
      [attr.lang]="otherCode()"
      (click)="language.toggle()"
    >
      <span pButtonLabel>{{ otherLabel() }}</span>
    </button>

    <button
      pButton
      type="button"
      [text]="true"
      severity="secondary"
      (click)="menu.toggle($event)"
      [attr.aria-expanded]="userMenuOpen()"
      aria-haspopup="menu"
      aria-controls="user-menu"
    >
      <span class="d-flex align-items-center gap-2">
        <p-avatar [label]="user.initials" shape="circle" aria-hidden="true" />
        <span class="topbar-identity d-none d-md-block">
          <span class="d-block fs-xs text-muted">{{ 'topbar.greeting' | translate }}</span>
          <span class="d-block fs-sm fw-semibold">{{ user.name }}</span>
        </span>
        <i class="pi pi-angle-down d-none d-md-block fs-xs text-muted" aria-hidden="true"></i>
      </span>
    </button>
  </div>
</header>

<p-menu
  #menu
  [id]="'user-menu'"
  [model]="userMenu()"
  [popup]="true"
  appendTo="body"
  [ariaLabel]="'topbar.userMenu' | translate"
  (onShow)="userMenuOpen.set(true)"
  (onHide)="userMenuOpen.set(false)"
>
  <ng-template #start>
    <div class="pt-2 px-3 pb-1">
      <span class="d-block fs-sm fw-semibold">{{ user.name }}</span>
      <span class="d-block fs-xs text-muted">{{ user.role }}</span>
    </div>
  </ng-template>
</p-menu>
