@let navItem = item();

<a
  class="nav-item d-flex align-items-center gap-3 fs-sm fw-medium"
  [class.nav-item--disabled]="navItem.disabled"
  [routerLink]="navItem.disabled ? null : navItem.route"
  routerLinkActive="nav-item--active"
  #rla="routerLinkActive"
  [attr.aria-disabled]="navItem.disabled || null"
  [attr.aria-current]="rla.isActive ? 'page' : null"
  [attr.title]="collapsed() ? navItem.label : null"
  (click)="navItem.disabled || navigate.emit()"
>
  <i class="pi {{ navItem.icon }} nav-item__icon fs-md flex-shrink-0" aria-hidden="true"></i>
  <span class="nav-item__label flex-1 text-truncate">{{ navItem.label }}</span>
  @if (navItem.disabled) {
    <span class="nav-item__soon soon-tag flex-shrink-0">Soon</span>
  }
</a>
