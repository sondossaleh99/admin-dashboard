<nav class="sidebar d-flex flex-column" aria-label="Main">
  <div class="sidebar__brand d-flex align-items-center gap-3 flex-shrink-0">
    <span class="sidebar__mark fs-md" aria-hidden="true">
      <i class="pi pi-bolt"></i>
    </span>
    <span class="sidebar__name flex-1 fs-lg fw-bold text-truncate">Shoppy</span>

    <button
      type="button"
      class="btn-icon d-none d-lg-flex"
      (click)="toggle()"
      [attr.aria-expanded]="!collapsed()"
      aria-controls="sidebar-nav"
    >
      <i
        class="pi"
        [class.pi-angle-double-left]="!collapsed()"
        [class.pi-angle-double-right]="collapsed()"
        aria-hidden="true"
      ></i>
      <span class="visually-hidden">{{ collapsed() ? 'Expand sidebar' : 'Collapse sidebar' }}</span>
    </button>

    <button type="button" class="btn-icon d-lg-none" (click)="closeDrawer()">
      <i class="pi pi-times" aria-hidden="true"></i>
      <span class="visually-hidden">Close navigation</span>
    </button>
  </div>

  <div class="sidebar__nav flex-1" id="sidebar-nav">
    <p-menu [model]="navigationGroups" ariaLabel="Main navigation" />
  </div>
</nav>
