<nav class="sidebar d-flex flex-column" aria-label="Main">
  <div class="sidebar-brand d-flex align-items-center gap-3 flex-shrink-0">
    @if (!collapsed()) {
      <span
        class="sidebar-mark d-flex align-items-center justify-content-center fs-md"
        aria-hidden="true"
      >
        <i class="pi pi-bolt"></i>
      </span>
      <span class="flex-1 fs-lg fw-bold text-truncate">Deskly</span>
    }

    <div class="d-none d-lg-block">
      <button
        pButton
        type="button"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        (click)="toggle()"
        [attr.aria-expanded]="!collapsed()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        aria-controls="sidebar-nav"
      >
        <i
          pButtonIcon
          class="pi"
          [class.pi-angle-double-left]="!collapsed()"
          [class.pi-angle-double-right]="collapsed()"
        ></i>
      </button>
    </div>

    <div class="d-lg-none">
      <button
        pButton
        type="button"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        aria-label="Close navigation"
        (click)="closeDrawer()"
      >
        <i pButtonIcon class="pi pi-times"></i>
      </button>
    </div>
  </div>

  <div class="sidebar-nav flex-1" id="sidebar-nav">
    <p-menu [model]="navigationGroups" [pt]="menuPt()" ariaLabel="Main navigation" />
  </div>
</nav>
