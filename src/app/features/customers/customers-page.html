<div class="d-flex flex-column gap-6">
  <app-section-header title="Customers" subtitle="Clients, their projects and budgets." />

  @if (service.error()) {
    <app-ui-card>
      <app-empty-state
        icon="pi-exclamation-circle"
        message="Could not load the customers"
        hint="The request failed. Nothing else on the page is affected."
        actionLabel="Retry"
        (action)="service.retry()"
      />
    </app-ui-card>
  } @else if (service.loading()) {
    <app-table-skeleton />
  } @else if (service.data(); as customers) {
    <app-customers-table [customers]="customers" (remove)="service.remove($event)" />
  }
</div>
