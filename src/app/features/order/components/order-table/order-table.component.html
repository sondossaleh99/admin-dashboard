<app-ui-card title="All orders" [subtitle]="subtitle()" [flush]="true">
  <p-table
    [value]="tableValue()"
    [lazy]="true"
    (onLazyLoad)="onLazyLoad($event)"
    [totalRecords]="totalRecords()"
    [loading]="orders.isLoading()"
    [paginator]="true"
    [first]="page().first"
    [rows]="page().rows"
    [rowsPerPageOptions]="rowsPerPageOptions"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} of {totalRecords}"
    dataKey="id"
    styleClass="order-table"
    [rowHover]="true"
    responsiveLayout="scroll"
  >
    <ng-template #header>
      <tr>
        <th>Image</th>
        <th>Item</th>
        <th>Customer</th>
        <th class="text-end">Total</th>
        <th>Status</th>
        <th>Order ID</th>
        <th>Location</th>
      </tr>
    </ng-template>

    <ng-template #body let-order>
      <tr>
        <td>
          <p-avatar icon="pi pi-shopping-bag" shape="square" size="large" aria-hidden="true" />
        </td>
        <td class="fw-medium">{{ order.item }}</td>
        <td>{{ order.customer }}</td>
        <td class="text-end tabular-nums">{{ order.total | appCurrency: 2 }}</td>
        <td>
          <span class="status" [class]="'status--' + order.statusTone">{{
            order.statusLabel
          }}</span>
        </td>
        <td class="text-muted tabular-nums">#{{ order.id }}</td>
        <td>{{ order.location }}</td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      @if (!orders.isLoading()) {
        <tr>
          <td colspan="7" class="text-center p-8 text-muted fs-sm">No orders found.</td>
        </tr>
      }
    </ng-template>
  </p-table>
</app-ui-card>
