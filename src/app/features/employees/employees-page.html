<div class="d-flex flex-column gap-6">
  <app-section-header title="Employees" subtitle="The team, their roles and who they report to." />

  @if (service.error()) {
    <app-ui-card>
      <app-empty-state
        icon="pi-exclamation-circle"
        message="Could not load the employees"
        hint="The request failed. Nothing else on the page is affected."
        actionLabel="Retry"
        (action)="service.retry()"
      />
    </app-ui-card>
  } @else if (service.loading()) {
    <app-table-skeleton />
  } @else if (service.data(); as employees) {
    <app-employees-table [employees]="employees" />
  }
</div>
