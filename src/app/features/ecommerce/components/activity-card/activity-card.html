<app-ui-card title="Recent activity" subtitle="Latest order events">
  <ul class="list-unstyled m-0 d-flex flex-column gap-4">
    @for (event of events(); track event.id) {
      <li class="d-flex align-items-start gap-3">
        <span
          class="activity__dot activity__dot--{{
            event.tone
          }} d-flex align-items-center justify-content-center flex-shrink-0 fs-xs"
        >
          <i class="pi {{ event.icon }}" aria-hidden="true"></i>
        </span>
        <span class="flex-1 min-w-0">
          <span class="d-block fs-sm fw-medium text-truncate">{{ event.title }}</span>
          <span class="d-block fs-xs text-muted text-truncate">{{ event.detail }}</span>
        </span>
        <span class="flex-shrink-0 fs-xs text-muted">{{ event.timestamp | date: 'd MMM' }}</span>
      </li>
    }
  </ul>

  <div class="activity__footer mt-5 pt-4">
    <button type="button" class="btn-outline d-inline-flex align-items-center gap-2 fs-xs" disabled>
      Full order history
      <span class="activity__soon soon-tag">Soon</span>
    </button>
  </div>
</app-ui-card>
