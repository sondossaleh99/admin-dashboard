<app-ui-card>
  <div class="d-flex flex-wrap align-items-end justify-content-between gap-6">
    <div>
      <p class="fs-sm text-secondary">{{ earnings().label }}</p>
      <p class="hero__value tabular-nums mt-1 mb-3 fs-3xl fw-bold">
        {{ earnings().total | money: 2 }}
      </p>
      <app-delta-badge [value]="earnings().delta" />
    </div>

    <div class="hero__spark">
      <app-chart-sparkline [data]="earnings().trend" [height]="64" />
    </div>

    <div class="d-flex gap-8">
      <div>
        <p class="fs-xs text-muted">Budget</p>
        <p class="tabular-nums mt-1 fs-lg fw-semibold">
          {{ earnings().budget | money }}
        </p>
      </div>
      <div>
        <p class="fs-xs text-muted">Expense</p>
        <p class="tabular-nums mt-1 fs-lg fw-semibold">
          {{ earnings().expense | money }}
        </p>
      </div>
    </div>
  </div>
</app-ui-card>
