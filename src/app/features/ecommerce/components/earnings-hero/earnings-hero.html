<app-ui-card>
  <div class="hero">
    <div>
      <p class="hero__label">{{ earnings().label }}</p>
      <p class="hero__value tabular-nums">
        {{ earnings().total | currency: 'USD' : 'symbol' : '1.2-2' }}
      </p>
      <app-delta-badge [value]="earnings().delta" />
    </div>

    <div class="hero__spark">
      <app-chart-sparkline [data]="earnings().trend" [height]="64" />
    </div>

    <div class="hero__split">
      <div>
        <p class="hero__split-label">Budget</p>
        <p class="hero__split-value tabular-nums">
          {{ earnings().budget | currency: 'USD' : 'symbol' : '1.0-0' }}
        </p>
      </div>
      <div>
        <p class="hero__split-label">Expense</p>
        <p class="hero__split-value tabular-nums">
          {{ earnings().expense | currency: 'USD' : 'symbol' : '1.0-0' }}
        </p>
      </div>
    </div>
  </div>
</app-ui-card>
