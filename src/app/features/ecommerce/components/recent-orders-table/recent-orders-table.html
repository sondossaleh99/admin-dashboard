<app-ui-card title="Recent orders" [subtitle]="subtitle()" [flush]="true">
  <p-table
    #dt
    [value]="tableValue()"
    [rows]="6"
    [paginator]="orders().length > 6"
    [globalFilterFields]="['customer', 'item', 'id', 'statusLabel']"
    [filterDelay]="250"
    sortField="placedAt"
    [sortOrder]="-1"
    dataKey="id"
    styleClass="orders-table"
    [rowHover]="true"
    responsiveLayout="scroll"
  >
    <ng-template #caption>
      <div class="d-flex justify-content-end">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            #search
            pInputText
            pSize="small"
            type="search"
            placeholder="Search orders"
            autocomplete="off"
            aria-label="Search orders"
            (input)="dt.filterGlobal(search.value, 'contains')"
          />
        </p-iconfield>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="customer">Customer <p-sortIcon field="customer" /></th>
        <th class="col-item">Item</th>
        <th pSortableColumn="placedAt">Date <p-sortIcon field="placedAt" /></th>
        <th>Status</th>
        <th pSortableColumn="total" class="text-end">Total <p-sortIcon field="total" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-order>
      <tr>
        <td>
          <span class="text-muted fs-xs me-1">#{{ order.id }}</span>
          {{ order.customer }}
        </td>
        <td class="col-item">{{ order.item }}</td>
        <td>{{ order.placedAt | date: 'd MMM' }}</td>
        <td>
          <span class="status" [class]="'status--' + order.statusTone">{{
            order.statusLabel
          }}</span>
        </td>
        <td class="text-end tabular-nums">
          {{ order.total | appCurrency: 2 }}
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="text-center p-8 text-muted fs-sm">No orders found.</td>
      </tr>
    </ng-template>
  </p-table>
</app-ui-card>
