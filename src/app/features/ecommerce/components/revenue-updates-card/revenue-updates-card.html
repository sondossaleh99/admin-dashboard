<app-ui-card
  [title]="'ecommerce.revenue.title' | translate"
  [subtitle]="'ecommerce.revenue.subtitle' | translate: { count: periods().length }"
>
  <p-selectbutton
    card-actions
    [options]="ranges()"
    optionLabel="label"
    optionValue="id"
    [allowEmpty]="false"
    size="small"
    ariaLabelledBy="revenue-range-label"
    [(ngModel)]="range"
  />
  <span id="revenue-range-label" class="visually-hidden">{{
    'ecommerce.revenue.period' | translate
  }}</span>

  <div class="totals d-flex flex-wrap gap-8 pb-5 mb-4">
    @for (total of totals(); track total.label) {
      <div>
        <p class="fs-xs text-muted">{{ total.label | translate }}</p>
        <p class="tabular-nums mt-1 fs-xl fw-semibold">
          {{ total.value | appCurrency }}
        </p>
      </div>
    }
  </div>

  <app-chart-combo [categories]="periods()" [series]="series()" [height]="300" />
</app-ui-card>
