<app-ui-card
  title="Revenue updates"
  [subtitle]="'Budget against expense, ' + periods().length + ' months'"
>
  <div card-actions class="range" role="group" aria-label="Period">
    <button
      type="button"
      class="range__option"
      [class.range__option--on]="range() === RevenueRange.SixMonths"
      (click)="setRange(RevenueRange.SixMonths)"
      [attr.aria-pressed]="range() === RevenueRange.SixMonths"
    >
      6 months
    </button>
    <button
      type="button"
      class="range__option"
      [class.range__option--on]="range() === RevenueRange.TwelveMonths"
      (click)="setRange(RevenueRange.TwelveMonths)"
      [attr.aria-pressed]="range() === RevenueRange.TwelveMonths"
    >
      12 months
    </button>
  </div>

  <div class="totals">
    <div>
      <p class="totals__label">Budget</p>
      <p class="totals__value tabular-nums">
        {{ totals().budget | currency: 'USD' : 'symbol' : '1.0-0' }}
      </p>
    </div>
    <div>
      <p class="totals__label">Expense</p>
      <p class="totals__value tabular-nums">
        {{ totals().expense | currency: 'USD' : 'symbol' : '1.0-0' }}
      </p>
    </div>
    <div>
      <p class="totals__label">Margin</p>
      <p class="totals__value tabular-nums">
        {{ totals().margin | currency: 'USD' : 'symbol' : '1.0-0' }}
      </p>
    </div>
  </div>

  <app-chart-combo [categories]="periods()" [series]="series()" [height]="300" />
</app-ui-card>
