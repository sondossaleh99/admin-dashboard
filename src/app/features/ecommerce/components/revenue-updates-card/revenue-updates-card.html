<app-ui-card
  title="Revenue updates"
  [subtitle]="'Budget against expense, ' + periods().length + ' months'"
>
  <div card-actions class="range d-flex gap-1" role="group" aria-label="Period">
    @for (option of ranges; track option.id) {
      <button
        type="button"
        class="range__option py-1 px-3 fs-xs fw-medium"
        [class.range__option--on]="range() === option.id"
        (click)="setRange(option.id)"
        [attr.aria-pressed]="range() === option.id"
      >
        {{ option.label }}
      </button>
    }
  </div>

  <div class="totals d-flex flex-wrap gap-8 pb-5 mb-4">
    @for (key of totalKeys; track key) {
      <div>
        <p class="fs-xs text-muted">{{ totalLabels[key] }}</p>
        <p class="tabular-nums mt-1 fs-xl fw-semibold">
          {{ totals()[key] | appCurrency }}
        </p>
      </div>
    }
  </div>

  <app-chart-combo [categories]="periods()" [series]="series()" [height]="300" />
</app-ui-card>
