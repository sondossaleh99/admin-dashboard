<app-ui-card
  title="Revenue updates"
  [subtitle]="'Budget against expense, ' + periods().length + ' months'"
>
  <p-selectbutton
    card-actions
    [options]="ranges"
    optionLabel="label"
    optionValue="id"
    [allowEmpty]="false"
    size="small"
    ariaLabelledBy="revenue-range-label"
    [(ngModel)]="range"
  />
  <span id="revenue-range-label" class="visually-hidden">Period</span>

  <div class="totals d-flex flex-wrap gap-8 pb-5 mb-4">
    @for (total of totals(); track total.label) {
      <div>
        <p class="fs-xs text-muted">{{ total.label }}</p>
        <p class="tabular-nums mt-1 fs-xl fw-semibold">
          {{ total.value | appCurrency }}
        </p>
      </div>
    }
  </div>

  <app-chart-combo [categories]="periods()" [series]="series()" [height]="300" />
</app-ui-card>
