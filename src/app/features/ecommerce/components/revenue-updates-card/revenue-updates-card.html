<app-ui-card
  title="Revenue updates"
  [subtitle]="'Budget against expense, ' + periods().length + ' months'"
>
  <div card-actions class="range" role="group" aria-label="Period">
    <button
      type="button"
      class="range__option"
      [class.range__option--on]="range() === '6m'"
      (click)="setRange('6m')"
      [attr.aria-pressed]="range() === '6m'"
    >6 months</button>
    <button
      type="button"
      class="range__option"
      [class.range__option--on]="range() === '12m'"
      (click)="setRange('12m')"
      [attr.aria-pressed]="range() === '12m'"
    >12 months</button>
  </div>

  <div class="totals">
    <div>
      <p class="totals__label">Budget</p>
      <p class="totals__value tabular-nums">{{ totals().budget | currency: 'USD' : 'symbol' : '1.0-0' }}</p>
    </div>
    <div>
      <p class="totals__label">Expense</p>
      <p class="totals__value tabular-nums">{{ totals().expense | currency: 'USD' : 'symbol' : '1.0-0' }}</p>
    </div>
    <div>
      <p class="totals__label">Margin</p>
      <p class="totals__value tabular-nums">{{ totals().margin | currency: 'USD' : 'symbol' : '1.0-0' }}</p>
    </div>
  </div>

  <app-chart-combo [categories]="periods()" [series]="series()" [height]="300" />
</app-ui-card>
