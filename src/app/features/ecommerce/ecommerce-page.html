<div class="d-flex flex-column gap-6">
  <app-section-header
    [title]="'ecommerce.title' | translate"
    [subtitle]="'ecommerce.subtitle' | translate"
  />

  @if (service.error()) {
    <app-ui-card>
      <app-empty-state
        icon="pi-exclamation-circle"
        [message]="'ecommerce.errorMessage' | translate"
        [hint]="'ecommerce.errorHint' | translate"
        [actionLabel]="'common.retry' | translate"
        (action)="service.retry()"
      />
    </app-ui-card>
  } @else if (service.loading()) {
    <app-dashboard-skeleton />
  } @else if (service.data(); as dashboard) {
    <app-earnings-hero [earnings]="dashboard.earnings" />

    <app-kpi-row [kpis]="dashboard.kpis" />

    <div class="row g-6">
      <div class="col-12 col-xl-8">
        <app-revenue-updates-card [points]="dashboard.revenue" />
      </div>
      <div class="col-12 col-xl-4">
        <app-sales-breakdown-card [slices]="dashboard.salesBreakdown" />
      </div>
    </div>

    <div class="row g-6">
      <div class="col-12 col-lg-5">
        <app-weekly-stats-card [stats]="dashboard.weeklyStats" />
      </div>
      <div class="col-12 col-lg-7">
        <app-recent-orders-table [orders]="dashboard.recentOrders" />
      </div>
    </div>

    <div class="row g-6">
      <div class="col-12">
        <app-activity-card [orders]="dashboard.recentOrders" />
      </div>
    </div>
  }
</div>
