<div class="d-flex flex-column gap-6">
  <app-section-header title="Ecommerce" subtitle="Overview of sales, revenue and recent orders." />

  @if (error()) {
    <app-ui-card>
      <app-empty-state
        icon="pi-exclamation-circle"
        message="Could not load the dashboard"
        hint="The request failed. Nothing else on the page is affected."
        actionLabel="Retry"
        (action)="retry()"
      />
    </app-ui-card>
  } @else if (loading()) {
    <div class="row g-6">
      @for (placeholder of [1, 2, 3, 4]; track placeholder) {
        <div class="col-12 col-sm-6 col-xl-3">
          <app-ui-card>
            <div class="d-flex flex-column gap-3">
              <app-skeleton-block width="44px" height="44px" radius="var(--radius-lg)" />
              <app-skeleton-block width="60%" height="28px" />
              <app-skeleton-block width="40%" height="14px" />
            </div>
          </app-ui-card>
        </div>
      }
    </div>
  } @else if (data(); as dashboard) {
    <app-earnings-hero [earnings]="dashboard.earnings" />

    <app-kpi-row [kpis]="kpis()" />

    <div class="row g-6">
      <div class="col-12 col-xl-8">
        <app-revenue-updates-card
          [periods]="revenuePeriods()"
          [series]="revenueSeries()"
          [totals]="revenueTotals()"
          [range]="range()"
          (rangeChange)="setRange($event)"
        />
      </div>
      <div class="col-12 col-xl-4">
        <app-sales-breakdown-card [slices]="dashboard.salesBreakdown" [total]="salesTotal()" />
      </div>
    </div>

    <div class="row g-6">
      <div class="col-12 col-lg-5">
        <app-weekly-stats-card [stats]="dashboard.weeklyStats" />
      </div>
      <div class="col-12 col-lg-7">
        <app-recent-orders-table [orders]="dashboard.recentOrders" />
      </div>
    </div>

    <div class="row g-6">
      <div class="col-12">
        <app-activity-card [events]="activity()" />
      </div>
    </div>
  }
</div>
