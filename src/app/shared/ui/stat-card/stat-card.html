<app-ui-card>
  <!-- Explicit vertical rhythm rather than a uniform gap: the label belongs
       close to the figure it names, further from the icon chip above it. -->
  <div class="d-flex flex-column">
    <app-icon-chip [icon]="icon()" [tone]="tone()" />

    <p class="stat__value tabular-nums mt-4 fs-2xl fw-bold text-body">{{ value() }}</p>

    <div class="d-flex align-items-center justify-content-between gap-3 mt-1">
      <span class="fs-sm text-secondary text-truncate">{{ label() }}</span>
      @if (delta() !== undefined) {
        <app-delta-badge [value]="delta()!" />
      }
    </div>

    @if (caption()) {
      <p class="mt-2 fs-xs text-muted">{{ caption() }}</p>
    }
  </div>
</app-ui-card>
