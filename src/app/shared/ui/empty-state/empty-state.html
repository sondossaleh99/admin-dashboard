<i class="pi {{ icon() }} mb-1 fs-2xl text-muted" aria-hidden="true"></i>
<p class="fs-sm fw-medium text-body">{{ message() }}</p>
@if (hint()) {
  <p class="empty-state-hint fs-xs text-muted">{{ hint() }}</p>
}
@if (actionLabel()) {
  <div class="mt-2">
    <button pButton type="button" [outlined]="true" severity="secondary" (click)="action.emit()">
      <span pButtonLabel>{{ actionLabel() }}</span>
    </button>
  </div>
}
