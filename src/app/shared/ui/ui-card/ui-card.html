<section class="ui-card d-flex flex-column">
  @if (title() || subtitle()) {
    <header class="d-flex align-items-start gap-4 pt-6 px-6">
      <div class="flex-1 min-w-0">
        @if (title()) {
          <h2 class="fs-lg fw-semibold text-body">{{ title() }}</h2>
        }
        @if (subtitle()) {
          <p class="mt-1 fs-xs text-muted">{{ subtitle() }}</p>
        }
      </div>
      <div class="flex-shrink-0 d-flex align-items-center gap-2">
        <ng-content select="[card-actions]" />
      </div>
    </header>
  }

  <div class="ui-card-body flex-1 min-w-0">
    <ng-content />
  </div>
</section>
